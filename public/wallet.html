<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crypto Wallet - Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0f;
      color: #e0e0e0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      padding: 20px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid #1e1e2e;
    }
    .header h1 {
      font-size: 24px;
      font-weight: 700;
    }
    .header h1 span { color: #00ff88; }
    .header-actions {
      display: flex;
      gap: 12px;
    }
    .btn {
      padding: 10px 20px;
      border: 1px solid #1e1e2e;
      border-radius: 8px;
      background: #12121a;
      color: #e0e0e0;
      font-size: 14px;
      cursor: pointer;
      transition: border-color 0.3s, transform 0.2s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn:hover {
      border-color: #00ff8840;
      transform: translateY(-1px);
    }
    .btn-accent {
      background: linear-gradient(135deg, #00ff88, #00ccaa);
      color: #0a0a0f;
      border: none;
      font-weight: 600;
    }
    .btn-danger {
      border-color: #ff505040;
      color: #ff5050;
    }
    .btn-danger:hover { border-color: #ff5050; }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 30px;
    }
    @media (max-width: 768px) {
      .grid { grid-template-columns: 1fr; }
    }
    .card {
      background: #12121a;
      border: 1px solid #1e1e2e;
      border-radius: 12px;
      padding: 24px;
      transition: border-color 0.3s, transform 0.3s;
    }
    .card:hover {
      border-color: #00ff8840;
      transform: translateY(-1px);
    }
    .card-full { grid-column: 1 / -1; }
    .section-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .section-title::before {
      content: '';
      width: 8px;
      height: 8px;
      background: #00ff88;
      border-radius: 50%;
      box-shadow: 0 0 8px #00ff88;
    }
    .section-title h2 {
      font-size: 16px;
      font-weight: 600;
    }
    .wallet-address {
      background: #0a0a0f;
      border: 1px solid #1e1e2e;
      border-radius: 8px;
      padding: 12px 16px;
      font-family: monospace;
      font-size: 13px;
      word-break: break-all;
      color: #00ccaa;
      margin-bottom: 12px;
    }
    .portfolio-value {
      font-size: 36px;
      font-weight: 700;
      color: #00ff88;
      margin-bottom: 4px;
    }
    .portfolio-label {
      font-size: 13px;
      color: #888;
    }
    .balance-list {
      list-style: none;
    }
    .balance-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #1e1e2e;
    }
    .balance-item:last-child { border-bottom: none; }
    .balance-symbol {
      font-weight: 600;
      font-size: 14px;
    }
    .balance-amount {
      font-family: monospace;
      font-size: 14px;
      color: #00ccaa;
    }
    .coins-table {
      width: 100%;
      border-collapse: collapse;
    }
    .coins-table th {
      text-align: left;
      font-size: 12px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 8px 12px;
      border-bottom: 1px solid #1e1e2e;
    }
    .coins-table td {
      padding: 10px 12px;
      font-size: 14px;
      border-bottom: 1px solid #1e1e2e08;
    }
    .coins-table tr:hover td {
      background: #1e1e2e20;
    }
    .coin-name {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .coin-icon {
      width: 24px;
      height: 24px;
      border-radius: 50%;
    }
    .change-positive { color: #00ff88; }
    .change-negative { color: #ff5050; }
    .import-section {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #1e1e2e;
    }
    .import-section input, .import-section textarea {
      width: 100%;
      padding: 12px;
      background: #0a0a0f;
      border: 1px solid #1e1e2e;
      border-radius: 8px;
      color: #e0e0e0;
      font-size: 14px;
      outline: none;
      margin-bottom: 10px;
      resize: vertical;
    }
    .import-section input:focus, .import-section textarea:focus {
      border-color: #00ff88;
    }
    .status-msg {
      font-size: 13px;
      margin-top: 8px;
      padding: 8px 12px;
      border-radius: 6px;
      display: none;
    }
    .status-msg.success {
      display: block;
      background: #00ff8810;
      color: #00ff88;
      border: 1px solid #00ff8830;
    }
    .status-msg.error {
      display: block;
      background: #ff505010;
      color: #ff5050;
      border: 1px solid #ff505030;
    }
    .refresh-info {
      font-size: 12px;
      color: #666;
      margin-top: 8px;
    }
    .loading {
      color: #888;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1><span>⬡</span> CryptoWallet</h1>
    <div class="header-actions">
      <a href="/send" class="btn btn-accent">↗ Send</a>
      <a href="/receive" class="btn">↙ Receive</a>
      <button class="btn" onclick="refreshAll()">⟳ Refresh</button>
      <button class="btn btn-danger" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="grid">
    <!-- Portfolio Card -->
    <div class="card">
      <div class="section-title"><h2>Portfolio</h2></div>
      <div class="portfolio-value" id="totalValue">$0.00</div>
      <div class="portfolio-label">Total Portfolio Value (USD)</div>
      <div class="refresh-info" id="refreshInfo">Auto-refreshes every 30s</div>
    </div>

    <!-- Wallet Card -->
    <div class="card">
      <div class="section-title"><h2>Wallet</h2></div>
      <div id="walletInfo">
        <p class="loading">Loading wallet...</p>
      </div>
      <div class="import-section">
        <textarea id="importInput" rows="2" placeholder="Enter mnemonic phrase or private key to import..."></textarea>
        <button class="btn" onclick="importWallet()">Import Wallet</button>
        <div class="status-msg" id="importStatus"></div>
      </div>
    </div>

    <!-- Balances Card -->
    <div class="card">
      <div class="section-title"><h2>Balances</h2></div>
      <ul class="balance-list" id="balanceList">
        <li class="loading">Loading balances...</li>
      </ul>
    </div>

    <!-- Network Addresses Card -->
    <div class="card">
      <div class="section-title"><h2>Network Addresses</h2></div>
      <div id="addressList">
        <p class="loading">Loading addresses...</p>
      </div>
    </div>

    <!-- Top Coins Card -->
    <div class="card card-full">
      <div class="section-title"><h2>Top 20 Coins</h2></div>
      <div style="overflow-x: auto;">
        <table class="coins-table" id="coinsTable">
          <thead>
            <tr>
              <th>#</th>
              <th>Coin</th>
              <th>Price (USD)</th>
              <th>24h Change</th>
              <th>Market Cap</th>
            </tr>
          </thead>
          <tbody id="coinsBody">
            <tr><td colspan="5" class="loading">Loading prices...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    let priceData = {};
    let refreshInterval;

    async function checkAuth() {
      try {
        const res = await fetch('/api/wallet');
        if (res.status === 401) {
          window.location.href = '/';
          return false;
        }
        return true;
      } catch { return false; }
    }

    async function loadWallet() {
      try {
        const res = await fetch('/api/wallet');
        if (res.status === 401) { window.location.href = '/'; return; }
        const data = await res.json();
        const walletInfo = document.getElementById('walletInfo');
        
        let html = `<div class="wallet-address">${data.address}</div>`;
        if (data.isNew && data.mnemonic) {
          html += `<div class="status-msg success">New wallet generated! Save your mnemonic securely:<br><strong style="word-break:break-all;">${data.mnemonic}</strong></div>`;
        }
        walletInfo.innerHTML = html;
        loadAddresses();
      } catch (err) {
        document.getElementById('walletInfo').innerHTML = '<p style="color:#ff5050;">Failed to load wallet</p>';
      }
    }

    async function loadAddresses() {
      const networks = ['ethereum', 'bnb', 'polygon', 'arbitrum', 'optimism', 'bitcoin'];
      const container = document.getElementById('addressList');
      let html = '';
      
      for (const net of networks) {
        try {
          const res = await fetch(`/api/address/${net}`);
          const data = await res.json();
          html += `<div style="margin-bottom:8px;"><span style="color:#888;font-size:12px;text-transform:uppercase;">${net}</span><div class="wallet-address" style="margin-bottom:4px;font-size:12px;">${data.address}</div></div>`;
        } catch {}
      }
      container.innerHTML = html || '<p class="loading">No addresses available</p>';
    }

    async function loadBalances() {
      try {
        const res = await fetch('/api/balances');
        if (res.status === 401) { window.location.href = '/'; return; }
        const data = await res.json();
        const list = document.getElementById('balanceList');
        
        let html = '';
        const balances = data.balances;
        const entries = Object.entries(balances);
        
        for (const [key, val] of entries) {
          const balance = parseFloat(val.balance) || 0;
          html += `<li class="balance-item">
            <span class="balance-symbol">${val.symbol}</span>
            <span class="balance-amount">${balance.toFixed(6)}</span>
          </li>`;
        }
        
        list.innerHTML = html || '<li class="loading">No balances to show</li>';
        calculatePortfolio(balances);
      } catch (err) {
        document.getElementById('balanceList').innerHTML = '<li style="color:#ff5050;">Failed to load balances</li>';
      }
    }

    async function loadPrices() {
      try {
        const res = await fetch('/api/prices');
        if (res.status === 401) { window.location.href = '/'; return; }
        const data = await res.json();
        const tbody = document.getElementById('coinsBody');
        
        let html = '';
        const top20 = data.coins.slice(0, 20);
        
        top20.forEach((coin, i) => {
          const changeClass = coin.change24h >= 0 ? 'change-positive' : 'change-negative';
          const changeSign = coin.change24h >= 0 ? '+' : '';
          html += `<tr>
            <td>${i + 1}</td>
            <td><div class="coin-name"><img class="coin-icon" src="${coin.image}" alt="${coin.symbol}"><span>${coin.name} (${coin.symbol})</span></div></td>
            <td>$${coin.price.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 6 })}</td>
            <td class="${changeClass}">${changeSign}${(coin.change24h || 0).toFixed(2)}%</td>
            <td>$${(coin.marketCap / 1e9).toFixed(2)}B</td>
          </tr>`;
        });
        
        tbody.innerHTML = html;

        // Store price data for portfolio calculation
        data.coins.forEach(c => { priceData[c.symbol] = c.price; });
      } catch (err) {
        document.getElementById('coinsBody').innerHTML = '<tr><td colspan="5" style="color:#ff5050;">Failed to load prices</td></tr>';
      }
    }

    function calculatePortfolio(balances) {
      let total = 0;
      const priceMap = {
        'ETH': priceData['ETH'] || 0,
        'BNB': priceData['BNB'] || 0,
        'MATIC': priceData['MATIC'] || priceData['POL'] || 0,
        'ARB_ETH': priceData['ETH'] || 0,
        'OP_ETH': priceData['ETH'] || 0,
        'BTC': priceData['BTC'] || 0
      };

      for (const [key, val] of Object.entries(balances)) {
        const balance = parseFloat(val.balance) || 0;
        const price = priceMap[val.symbol] || 0;
        total += balance * price;
      }

      document.getElementById('totalValue').textContent = `$${total.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
    }

    async function importWallet() {
      const input = document.getElementById('importInput').value.trim();
      const status = document.getElementById('importStatus');
      
      if (!input) {
        status.className = 'status-msg error';
        status.textContent = 'Please enter a mnemonic or private key';
        return;
      }

      try {
        const body = input.includes(' ') ? { mnemonic: input } : { privateKey: input };
        const res = await fetch('/api/wallet/import', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });

        const data = await res.json();
        if (res.ok) {
          status.className = 'status-msg success';
          status.textContent = 'Wallet imported successfully!';
          document.getElementById('importInput').value = '';
          loadWallet();
          loadBalances();
        } else {
          status.className = 'status-msg error';
          status.textContent = data.error || 'Import failed';
        }
      } catch (err) {
        status.className = 'status-msg error';
        status.textContent = 'Connection error';
      }
    }

    async function refreshAll() {
      await Promise.all([loadBalances(), loadPrices()]);
    }

    async function logout() {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/';
    }

    // Init
    (async () => {
      if (await checkAuth()) {
        loadWallet();
        loadBalances();
        loadPrices();
        // Auto-refresh every 30 seconds
        refreshInterval = setInterval(refreshAll, 30000);
      }
    })();
  </script>
</body>
</html>
